name: Propozycja projektu
description: Zaproponuj nowy projekt Komisji Cyfryzacji
title: "[Project]: "
labels:
  - project
body:
  - type: textarea
    id: goal
    attributes:
      label: Cel projektu
      description: Jaki problem ma rozwiązać projekt i dla kogo?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Zakres pierwszej wersji
      description: Co powinno znaleźć się w minimalnej sensownej wersji?
    validations:
      required: true
  - type: textarea
    id: stakeholders
    attributes:
      label: Odbiorcy i interesariusze
      description: Kto będzie używał rozwiązania lub powinien uczestniczyć w ustaleniach?
  - type: textarea
    id: maintenance
    attributes:
      label: Utrzymanie
      description: Kto może rozwijać projekt po wdrożeniu i od czego będzie zależał?
  - type: textarea
    id: notes
    attributes:
      label: Dodatkowe informacje
